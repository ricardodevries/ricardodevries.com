version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []
    # Keep TypeScript within the versions supported by Astro's checker and typescript-eslint.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
