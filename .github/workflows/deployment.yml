name: "Deployment"

on:
  push:
    branches: [main]

concurrency:
  group: deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci --no-audit --no-fund

      - name: "Build"
        run: npm run build

      - name: "Archive build artifacts"
        run: tar -czf build.tar.gz dist/ db/schema.ts drizzle.config.ts package.json package-lock.json

      - name: "Upload build artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.sha }}
          path: build.tar.gz
          retention-days: 1

  deploy:
    name: Deployment
    needs: build
    runs-on: production
    timeout-minutes: 15
    permissions:
      actions: write # required by geekyeggo/delete-artifact to delete workflow artifacts
      deployments: write # required because this job declares an `environment`
    environment:
      name: production
      url: https://ricardodevries.com
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.sha }}

      - name: "Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      - name: "Extract build artifact"
        run: |
          mkdir -p /var/www/releases/${{ github.sha }}
          tar -xzf build.tar.gz -C /var/www/releases/${{ github.sha }}
          rm build.tar.gz

      - name: "Install dependencies"
        working-directory: /var/www/releases/${{ github.sha }}
        run: npm ci --no-audit --no-fund

      - name: "Apply database schema"
        working-directory: /var/www/releases/${{ github.sha }}
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          : "${DATABASE_URL:?Set the production DATABASE_URL variable}"
          npm run db:push

      - name: "Activate release"
        run: sudo /usr/bin/ln -sfnT /var/www/releases/${{ github.sha }} /var/www/current

      - name: "Restart service"
        run: sudo systemctl restart ricardodevries-web.service

      - name: "Prune old releases"
        run: ls -1dt /var/www/releases/*/ | tail -n +4 | xargs -r rm -rf

      - name: "Delete build artifact"
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ${{ github.sha }}
