name: "Deployment"

on:
  push:
    branches: [main]

concurrency:
  group: deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci --no-audit --no-fund

      - name: "Build"
        run: npm run build

      - name: "Archive build artifacts"
        run: tar -czf build.tar.gz dist/ drizzle/ scripts/ package.json package-lock.json

      - name: "Upload build artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.sha }}
          path: build.tar.gz

  deploy:
    name: Deployment
    needs: build
    runs-on: production
    environment:
      name: production
      url: https://ricardodevries.com
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ github.sha }}

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: "Extract build artifact"
        run: |
          mkdir -p /var/www/releases/${{ github.sha }}
          tar -xzf build.tar.gz -C /var/www/releases/${{ github.sha }}
          rm build.tar.gz

      - name: "Install dependencies"
        working-directory: /var/www/releases/${{ github.sha }}
        run: npm ci --no-audit --no-fund

      - name: "Run database migrations"
        working-directory: /var/www/releases/${{ github.sha }}
        env:
          DATABASE_URL: ${{ vars.ASTRO_DB_REMOTE_URL }}
        run: node scripts/migrate.mjs

      - name: "Activate release"
        run: sudo /usr/bin/ln -sfnT /var/www/releases/${{ github.sha }} /var/www/current

      - name: "Restart service"
        run: sudo systemctl restart ricardodevries-web.service

      - name: "Prune old releases"
        run: ls -1dt /var/www/releases/*/ | tail -n +4 | xargs -r rm -rf

      - name: "Delete build artifact"
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: ${{ github.sha }}
